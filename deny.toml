# cargo-deny configuration: the dependency licence allow-list decided
# 2026-10-06 (docs/IMPLEMENTATION_PLAN.md §1a). A crate outside this list is
# refused in review, not waved through.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "OFL-1.1", "CC0-1.0",
  "BSL-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL", "Unlicense", "NCSA",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[advisories]
yanked = "warn"
# Unmaintained-crate notices we cannot act on: both arrive through
# dependencies that have no maintained alternative yet. Revisit at each
# release; drop the entry the moment the parent crate moves off it.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) via lofty and exr; build-time only" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via ab_glyph (cover watermark text); no maintained drop-in" },
]
