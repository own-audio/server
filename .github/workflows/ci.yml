name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: server (check, clippy, test, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo check
        working-directory: backend
      - run: cargo clippy -- -D warnings
        working-directory: backend
      - run: cargo test
        working-directory: backend
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check licenses advisories
      - run: cargo audit
        working-directory: backend
        continue-on-error: true

  console:
    name: web console (i18n, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: i18n
      - run: npm ci
        working-directory: frontend
      - run: npm run i18n && git diff --exit-code -- src/i18n/generated
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" --excludePrivatePackages
        working-directory: frontend

  conformance:
    name: conformance against the compose stack
    runs-on: ubuntu-latest
    needs: [server, console]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack from source
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^S3_SECRET_KEY=$/S3_SECRET_KEY=ci-secret-key-0000/; s/^SESSION_SECRET=$/SESSION_SECRET=ci-session-secret-not-for-production/' .env
          docker compose build server
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
      - name: First admin
        run: |
          curl -fs -X POST http://localhost:8080/api/v1/setup/complete -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"CiAdmin123!","display_name":"CI"}'
      - run: python3 conformance/run.py --base-url http://localhost:8080 --admin-email admin@example.com --admin-password 'CiAdmin123!' --report conformance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: conformance-report, path: conformance-report.json }
      - if: failure()
        run: docker compose logs server | tail -200
