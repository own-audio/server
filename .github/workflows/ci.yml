name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "brand/**", "LICENSE", "TRADEMARK.md"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "brand/**", "LICENSE", "TRADEMARK.md"]

# A newer push to the same branch cancels the run it supersedes: GitHub's
# free minutes for a private organisation repo are 2,000 a month and one full
# run is about 25 of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The gitleaks GitHub Action wants a paid licence for organisation repos;
      # the binary itself is MIT and does the same job.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose

  server:
    name: server (check, clippy, test, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same version as rust-toolchain.toml and backend/Dockerfile — bump all three together.
      - uses: dtolnay/rust-toolchain@1.97
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo check
        working-directory: backend
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: backend
      - run: cargo test
        working-directory: backend
      # Native install rather than the Docker action: the action's container
      # does not carry the toolchain rust-toolchain.toml pins.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses advisories bans

  console:
    name: web console (i18n, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: i18n
      - run: npm ci
        working-directory: frontend
      - run: npm run i18n && git diff --exit-code -- src/i18n/generated
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" --excludePrivatePackages
        working-directory: frontend

  conformance:
    name: conformance (${{ matrix.storage }} storage)
    runs-on: ubuntu-latest
    needs: [server, console]
    strategy:
      fail-fast: false
      matrix:
        storage: [local, s3]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the server image (layer cache shared across runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: ownaudio/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^SESSION_SECRET=$/SESSION_SECRET=ci-session-secret-not-for-production/' .env
          echo 'SERVER_IMAGE=ownaudio/server:ci' >> .env
          if [ "${{ matrix.storage }}" = s3 ]; then
            printf 'STORAGE_KIND=s3\nCOMPOSE_PROFILES=s3\nS3_SECRET_KEY=ci-secret-key-0000\nS3_PUBLIC_ENDPOINT=http://localhost:9000\n' >> .env
          fi
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
      - name: First admin
        run: |
          curl -fs -X POST http://localhost:8080/api/v1/setup/complete -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"CiAdmin123!","display_name":"CI"}'
      - run: python3 conformance/run.py --base-url http://localhost:8080 --admin-email admin@example.com --admin-password 'CiAdmin123!' --report conformance-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "conformance-report-${{ matrix.storage }}", path: conformance-report.json, if-no-files-found: ignore }
      - if: failure()
        run: docker compose logs server | tail -200
