name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "brand/**", "LICENSE", "TRADEMARK.md"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "brand/**", "LICENSE", "TRADEMARK.md"]

# A newer push to the same branch cancels the run it supersedes: GitHub's
# free minutes for a private organisation repo are 2,000 a month and one full
# run is about 25 of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The gitleaks GitHub Action wants a paid licence for organisation repos;
      # the binary itself is MIT and does the same job.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose

  server:
    name: server (check, clippy, test, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # History and tags, for the contract check against the last release.
        with: { fetch-depth: 0 }
      # Same version as rust-toolchain.toml and backend/Dockerfile — bump all three together.
      - uses: dtolnay/rust-toolchain@1.97
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo check
        working-directory: backend
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: backend
      # Includes openapi_json_is_current: docs/api/openapi.json must match the code.
      - run: cargo test
        working-directory: backend
      - name: API contract against the last release (additive only, revision bumped)
        run: python3 scripts/check-api-contract.py
      # Native install rather than the Docker action: the action's container
      # does not carry the toolchain rust-toolchain.toml pins.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses advisories bans

  console:
    name: web console (i18n, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: i18n
      - run: npm ci
        working-directory: frontend
      - run: npm run i18n && git diff --exit-code -- src/i18n/generated
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend
      # Only what ships: dev tooling advisories are noise for a static bundle.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" --excludePrivatePackages
        working-directory: frontend

  conformance:
    name: conformance (${{ matrix.storage }} storage)
    runs-on: ubuntu-latest
    needs: [server, console]
    strategy:
      fail-fast: false
      matrix:
        storage: [local, s3]
    env:
      # A family storage limit the suite can test against (1 GiB; nothing in
      # the suite comes near it). The server and the suite read the same name.
      STORAGE__FAMILY_QUOTA_BYTES: "1073741824"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the server image (layer cache shared across runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: ownaudio/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (fixed CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ownaudio/server:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^SESSION_SECRET=$/SESSION_SECRET=ci-session-secret-not-for-production/' .env
          echo 'SERVER_IMAGE=ownaudio/server:ci' >> .env
          echo "STORAGE__FAMILY_QUOTA_BYTES=$STORAGE__FAMILY_QUOTA_BYTES" >> .env
          # The suite signs in a few hundred times from one address; the per-IP
          # login limit is not what it tests (the per-account lock is).
          echo 'SERVER__RATE_LIMIT__LOGIN_PER_MINUTE=1000' >> .env
          echo 'SERVER__RATE_LIMIT__API_PER_MINUTE=100000' >> .env
          echo 'SERVER__RATE_LIMIT__SEARCH_PER_MINUTE=10000' >> .env
          echo 'SERVER__RATE_LIMIT__OUTBOUND_PER_MINUTE=10000' >> .env
          files="-f docker-compose.yml"
          if [ "${{ matrix.storage }}" = s3 ]; then
            printf 'STORAGE_KIND=s3\nCOMPOSE_PROFILES=s3\nS3_SECRET_KEY=ci-secret-key-0000\nS3_PUBLIC_ENDPOINT=http://localhost:9000\n' >> .env
          else
            # The local job also covers read-only library folders, on generated tones.
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            conformance/tools/make_library_fixtures.sh /tmp/oa-library
            files="$files -f conformance/compose.library.yml"
          fi
          docker compose $files up -d --no-build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
      - name: First admin
        run: |
          curl -fs -X POST http://localhost:8080/api/v1/setup/complete -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"CiAdmin123!-long","display_name":"CI"}'
      - run: python3 conformance/run.py --base-url http://localhost:8080 --admin-email admin@example.com --admin-password 'CiAdmin123!-long' --report conformance-report.json
      # Security hardening plan §9: the server's log of a whole conformance run
      # never carries a password or a bearer token.
      - name: No secrets in the server log
        run: |
          files="-f docker-compose.yml"
          [ "${{ matrix.storage }}" = s3 ] || files="$files -f conformance/compose.library.yml"
          if docker compose $files logs server 2>&1 | grep -E "CiAdmin123|FamilyTest123|Bearer [A-Za-z0-9._-]{20,}|refresh_token\"?:\s*\"[A-Za-z0-9]{20,}"; then
            echo "a secret made it into the server log"; exit 1
          fi
      # BACKUP.md's restore, word for word, into an emptied database; then the
      # server must work on what came back.
      - name: Backup and restore
        run: |
          files="-f docker-compose.yml"
          [ "${{ matrix.storage }}" = s3 ] || files="$files -f conformance/compose.library.yml"
          docker compose $files exec -T backup sh /db-backup.sh now
          dump=$(ls backups/daily/*.dump | tail -1)
          docker compose $files stop server
          docker compose $files exec -T postgres sh -c 'dropdb -U "$POSTGRES_USER" "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
          docker compose $files exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --exit-on-error' < "$dump"
          docker compose $files up -d --no-build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
      - name: The restored database works
        # After a minute, so the per-IP login limit from the full run has reset.
        run: sleep 61 && python3 conformance/run.py --base-url http://localhost:8080 --admin-email admin@example.com --admin-password 'CiAdmin123!-long' --only smoke,families
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "conformance-report-${{ matrix.storage }}", path: conformance-report.json, if-no-files-found: ignore }
      - if: failure()
        run: docker compose logs server | tail -200
