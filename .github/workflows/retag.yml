name: retag image

# Points a channel tag at an image that is already published, without building
# it again: e.g. `beta` at 1.0.4-beta.1. The release workflow moves `beta` by
# itself from the next beta on; this is for moving it by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to point at, e.g. 1.0.4-beta.1"
        required: true
      channel:
        description: "Channel tag to move"
        required: true
        default: beta
        type: choice
        options: [beta]

env:
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'ownaudio/server' }}

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Move the channel tag
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          images="ghcr.io/own-audio/server"
          [ "$HAS_DOCKERHUB" = "true" ] && images="$images $DOCKERHUB_IMAGE"
          for image in $images; do
            docker buildx imagetools inspect "$image:$VERSION" >/dev/null
            docker buildx imagetools create -t "$image:$CHANNEL" "$image:$VERSION"
            docker buildx imagetools inspect "$image:$CHANNEL" | head -3
          done
