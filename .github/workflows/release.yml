name: release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to (re)build, e.g. v1.0.0-alpha.1"
        required: true

env:
  # Docker Hub is optional until the account exists; GHCR always gets the image.
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  # One native build per architecture (no QEMU: a Rust release build under
  # emulation takes hours), pushed by digest; the manifest job stitches them
  # into one multi-arch tag.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      has_dockerhub: ${{ env.HAS_DOCKERHUB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/own-audio/server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr '/' '-')"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/own-audio/server
            ${{ env.HAS_DOCKERHUB == 'true' && 'ownaudio/server' || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.ref || github.ref_name }},enable=${{ !contains(github.event.inputs.ref || github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.event.inputs.ref || github.ref_name, '-') }}
      - name: Create the multi-arch manifests
        working-directory: /tmp/digests
        run: |
          set -e
          for image in $(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[] | split(":")[0]' | sort -u); do
            tags=$(echo '${{ steps.meta.outputs.json }}' | jq -r --arg img "$image" '.tags[] | select(startswith($img + ":")) | "-t " + .' | tr '\n' ' ')
            docker buildx imagetools create $tags $(for d in *; do echo "ghcr.io/own-audio/server@$(cat "$d")"; done)
          done
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/own-audio/server:${{ steps.meta.outputs.version }}
