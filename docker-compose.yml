# The own.audio server for a self-hoster: the server and PostgreSQL, with
# media on a local volume (or an S3-compatible store, see STORAGE_KIND). Copy .env.example to .env, set the
# three secrets, `docker compose up -d`, open http://localhost:8080 and create
# the first admin. INSTALL.md has the long version.
services:
  postgres:
    # The major version is pinned on purpose: a new major needs a dump and
    # restore (scripts/pg-upgrade.sh, UPGRADING.md), so it never changes by
    # accident. That script is what sets POSTGRES_MAJOR and PGDATA_DIR.
    image: postgres:${POSTGRES_MAJOR:-16}-alpine
    # Sized for one family (docs/RAM_USAGE.md); raise shared_buffers for a very
    # large catalog. The server's pool is 10 (DATABASE_MAX_CONNECTIONS).
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=30
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ownaudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ownaudio}
      PGDATA: ${PGDATA_DIR:-/var/lib/postgresql/data/pgdata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ownaudio} -d ${POSTGRES_DB:-ownaudio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # A dump of the database every night at BACKUP_HOUR (UTC) into BACKUP_DIR,
  # the last 7 days and 4 weeks kept. Same image as the database, so the dump
  # tool always matches it. Restoring: BACKUP.md.
  backup:
    image: postgres:${POSTGRES_MAJOR:-16}-alpine
    entrypoint: ["/bin/sh", "/db-backup.sh", "loop"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-ownaudio}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ownaudio}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    restart: unless-stopped

  # Object store for uploads. Any S3-compatible store works; RustFS is the one
  # this stack ships with. Console: http://localhost:9001/rustfs/console/
  rustfs:
    # Only with STORAGE_KIND=s3 and the `s3` profile (COMPOSE_PROFILES=s3);
    # the default keeps media in the server's own volume.
    profiles: ["s3"]
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ownaudio}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    volumes:
      - rustfs_data:/data
    ports:
      # Browsers and apps fetch media straight from the store through presigned
      # URLs, so this port must be reachable from them (see STORAGE__PUBLIC_ENDPOINT).
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  server:
    # `docker compose pull server` takes the published image (amd64 and arm64);
    # `docker compose build server` builds this checkout instead.
    image: ${SERVER_IMAGE:-ghcr.io/own-audio/server:1.0.0-beta.2}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
        required: false
    environment:
      SERVER__HOST: "0.0.0.0"
      SERVER__PORT: "8080"
      # The address people and apps use to reach this server.
      SERVER__BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Other addresses it answers on (home network, VPN), comma-separated;
      # apps switch to the best one on each network.
      SERVER__ADDRESSES: ${OTHER_URLS:-}
      DATABASE_URL: "postgres://${POSTGRES_USER:-ownaudio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ownaudio}"
      # `local` (default): media lives in the media_data volume and streams
      # through the server. `s3`: an S3-compatible store, RustFS here with
      # COMPOSE_PROFILES=s3, or any other with the settings below.
      STORAGE__KIND: ${STORAGE_KIND:-local}
      STORAGE__PATH: /data/media
      # With s3: stream through the server instead of presigned links to the
      # store's host (for networks that block it).
      STORAGE__PROXY: ${S3_PROXY:-false}
      STORAGE__ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      # What a browser can reach; presigned URLs are signed against it, so it
      # must be the address the store is really served at.
      STORAGE__PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE__REGION: "us-east-1"
      STORAGE__BUCKET: ${S3_BUCKET:-own-audio}
      STORAGE__ACCESS_KEY: ${S3_ACCESS_KEY:-ownaudio}
      STORAGE__SECRET_KEY: ${S3_SECRET_KEY}
      STORAGE__PATH_STYLE: "true"
      AUTH__SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      AUTH__LOCAL_ENABLED: "true"
      # Accounts are created by the admin or by family invite; open sign-up is off.
      AUTH__REGISTRATION_OPEN: "false"
      RUST_LOG: ${RUST_LOG:-audio2=info,tower_http=warn}
      # The server runs as this user and group, not root. It must be able to
      # read your library folders; its own storage is handed to it at start.
      # Optional mail for invites (SMTP submission, see INSTALL.md).
      MAIL__SMTP_HOST: ${SMTP_HOST:-}
      MAIL__SMTP_PORT: ${SMTP_PORT:-}
      MAIL__SMTP_SECURITY: ${SMTP_SECURITY:-}
      MAIL__SMTP_USER: ${SMTP_USER:-}
      MAIL__SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL__FROM_ADDRESS: ${MAIL_FROM:-}
      MAIL__FROM_NAME: ${MAIL_FROM_NAME:-own.audio}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - media_data:/data/media
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  rustfs_data:
